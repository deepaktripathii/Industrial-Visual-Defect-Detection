[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "defectiq"
version = "1.0.0"
description = "Industrial visual defect detection with PyTorch, Grad-CAM and FastAPI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Deepak Tripathi" }]
keywords = ["computer-vision", "pytorch", "deep-learning", "grad-cam", "fastapi", "manufacturing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:torchvision.*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"tests/*.py" = ["E402"]
"src/defectiq/dashboard/app.py" = ["E402"]
# FastAPI dependency injection requires the File() call in the signature.
"src/defectiq/api/main.py" = ["B008"]
